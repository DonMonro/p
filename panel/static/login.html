<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Psiphon-3X-UI — Sign in</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <!-- Inter (variable) — same jsDelivr CDN family as Pico/Alpine for cache locality -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/index.css">
  <style>
    /* ── Night-Ops theme — design tokens ───────────────────────── */
    :root {
      --no-bg: #0B0E14;
      --no-bg-2: #10141C;
      --no-surface: #151A22;
      --no-surface-2: #1A1F29;
      --no-input: #20242B;
      --no-hairline: rgba(255,255,255,.08);
      --no-hairline-2: rgba(255,255,255,.16);
      --no-accent: #2563EB;
      --no-accent-hi: #3B82F6;
      --no-accent-soft: rgba(37,99,235,.22);
      --no-glow: rgba(37,99,235,.35);
      --no-text: #F2F5F9;
      --no-text-2: #9AA3B2;
      --no-ok: #22C55E;
      --no-err: #EF4444;
      --no-warn: #F59E0B;
      --no-console: #0A0D12;
      --no-radius-card: 16px;
      --no-radius-ctl: 8px;
      --no-radius-pill: 999px;
      /* Rebrand Pico's default cyan accent to the Night-Ops blue so native
         checkbox/radio fills, focus rings and links match the theme. */
      --pico-primary: var(--no-accent-hi);
      --pico-primary-background: var(--no-accent);
      --pico-primary-border: var(--no-accent);
      --pico-primary-focus: var(--no-accent-soft);
      --pico-primary-hover: var(--no-accent-hi);
      --pico-primary-hover-background: var(--no-accent-hi);
      --pico-primary-hover-border: var(--no-accent-hi);
    }

    body {
      display: flex; min-height: 100vh; align-items: center; justify-content: center;
      background:
        radial-gradient(600px 420px at 12% 8%,  rgba(37,99,235,.16), transparent 70%),
        radial-gradient(520px 380px at 88% 38%, rgba(37,99,235,.12), transparent 70%),
        radial-gradient(700px 480px at 78% 96%, rgba(37,99,235,.10), transparent 70%),
        linear-gradient(180deg, var(--no-bg) 0%, var(--no-bg-2) 100%);
      background-attachment: fixed;
      color: var(--no-text);
      font-family: "Inter Variable", "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      letter-spacing: .01em;
    }
    /* Barely-visible square grid overlay */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    main.container { position: relative; z-index: 1; width: 100%; }

    .login-card {
      width: 100%; max-width: 26rem; margin: 1rem auto;
      padding: 2.5rem 2.25rem 2.25rem;
      background: linear-gradient(180deg, var(--no-surface-2), var(--no-surface));
      border: 1px solid var(--no-hairline);
      border-radius: var(--no-radius-card);
      box-shadow: 0 0 60px rgba(37,99,235,.15), 0 24px 48px rgba(0,0,0,.45);
    }
    .login-card h1 { font-size: 1.75rem; font-weight: 700; margin: 0 0 .35rem; color: var(--no-text); }
    .login-card .sub { color: var(--no-text-2); margin-bottom: 1.75rem; font-size: .9rem; line-height: 1.5; }

    .login-card label { color: var(--no-text); font-size: .85rem; font-weight: 600; margin-bottom: .4rem; }
    .login-card input {
      background: var(--no-input); border: 1px solid var(--no-hairline);
      border-radius: var(--no-radius-ctl); color: var(--no-text);
      height: 2.75rem; padding: 0 .9rem; transition: border-color .15s ease, box-shadow .15s ease;
    }
    .login-card input::placeholder { color: rgba(154,163,178,.6); }
    .login-card input:focus { border-color: var(--no-accent-hi); box-shadow: 0 0 0 3px var(--no-accent-soft); outline: none; }

    .login-card button {
      width: 100%; margin-top: .5rem; height: 2.75rem;
      background: var(--no-accent); border: 1px solid transparent;
      border-radius: var(--no-radius-ctl); color: #fff; font-weight: 600;
      letter-spacing: .02em; transition: background .15s ease, box-shadow .15s ease;
    }
    .login-card button:hover:not([disabled]) { background: var(--no-accent-hi); box-shadow: 0 6px 20px var(--no-glow); }
    .login-card button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--no-accent-soft); }
    .login-card button[disabled] { opacity: .55; pointer-events: none; }

    .toast { position: fixed; bottom: 1rem; right: 1rem; padding: .7rem 1rem;
             background: var(--no-err); color: #fff; border-radius: var(--no-radius-ctl);
             font-size: .875rem; z-index: 9; box-shadow: 0 8px 24px rgba(0,0,0,.5);
             max-width: 22rem; border: 1px solid rgba(255,255,255,.12); }
    .toast.warn { background: var(--no-warn); color: #1a1206; }
    .toast.ok { background: var(--no-ok); color: #06180c; }

    /* Brand: blue uppercase title + short centered underline bar */
    .branding { text-align: center; margin-bottom: 1.25rem; }
    .branding .badge {
      display: inline-block; background: transparent; color: var(--no-accent-hi);
      padding: 0 0 .6rem; border-radius: 0; font-size: 1.05rem;
      font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
      position: relative;
    }
    .branding .badge::after {
      content: ""; position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
      width: 40px; height: 3px; border-radius: 999px; background: var(--no-accent);
    }
  </style>
</head>
<body>
  <main class="container" x-data="appLogin()" x-init="probeSession()" x-cloak>
    <article class="login-card">
      <div class="branding">
        <span class="badge">Psiphon-3X-UI</span>
      </div>
      <h1>Sign in</h1>
      <p class="sub">Enter the admin credentials printed at the end of the installer.</p>

      <!-- Inline error / status banner -->
      <template x-if="toast.text">
        <div class="toast" :class="toast.kind" x-text="toast.text"></div>
      </template>

      <form @submit.prevent="submit()" autocomplete="on">
        <label for="user">Username</label>
        <input id="user" name="user" type="text" autocomplete="username"
               x-model="form.user" required autofocus
               :disabled="busy" placeholder="admin">

        <label for="password" style="margin-top:.75rem">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               x-model="form.password" required
               :disabled="busy" placeholder="••••••••••">

        <button type="submit" :disabled="busy" :aria-busy="busy">
          <span x-show="!busy">Sign in</span>
          <span x-show="busy">Signing in…</span>
        </button>
      </form>
    </article>
  </main>

  <!-- Alpine.js (same CDN as the management dashboard for cache reuse) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    function appLogin() {
      return {
        form: { user: "", password: "" },
        busy: false,
        toast: { text: "", kind: "err" },

        /** If a valid session cookie is already present, jump straight to the
          * app the operator belongs on: ``/wizard`` before the first-run
          * setup is done, ``/dashboard`` afterward (see
          * ``panel.dashboard.router._require_wizard_completed`` for the 409
          * gate). */
        async probeSession() {
          try {
            const r = await fetch("/api/me", { credentials: "same-origin" });
            if (!r.ok) return;
            const body = await r.json();
            const target = body.wizard_completed ? "/dashboard" : "/wizard";
            window.location.replace(target);
          } catch (_) { /* no-op — show the login form */ }
        },

        /** Common post-login redirector: probe ``GET /api/me`` and dispatch
          * to ``/wizard`` or ``/dashboard`` based on ``wizard_completed``.
          * Falls back to ``/dashboard`` if the probe fails (the wizard
          * itself 409-redirects an authenticated user back to ``/wizard``
          * when needed, so even a wrong guess auto-corrects on arrival). */
        async _redirectAfterLogin(okBanner) {
          if (okBanner) this.banner(okBanner, "ok");
          try {
            const r = await fetch("/api/me", { credentials: "same-origin" });
            if (r.ok) {
              const body = await r.json();
              window.location.replace(body.wizard_completed ? "/dashboard" : "/wizard");
              return;
            }
          } catch (_) { /* fall through */ }
          window.location.replace("/dashboard");
        },

        /** Show a transient banner; auto-clears after a few seconds. */
        banner(message, kind) {
          this.toast = { text: message, kind: kind || "err" };
          if (kind === "ok") { setTimeout(() => { this.toast.text = ""; }, 1500); }
          else               { setTimeout(() => { this.toast.text = ""; }, 6000); }
        },

        /** POST the credentials and redirect on 204. */
        async submit() {
          if (this.busy) return;
          this.busy = true;
          this.toast.text = "";
          try {
            const r = await fetch("/auth/login", {
              method: "POST",
              credentials: "same-origin",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ user: this.form.user.trim(),
                                     password: this.form.password })
            });
            if (r.status === 204) {
              await this._redirectAfterLogin("Signed in — redirecting…");
              return;
            }
            // Try to surface the FastAPI {"detail": "..."} message verbatim.
            let detail = "";
            try { detail = (await r.json()).detail || ""; } catch (_) { /* non-JSON body */ }
            if (!detail) {
              detail = ({
                "401": "invalid username or password",
                "429": "too many login attempts — wait a minute and try again",
                "503": "panel not initialised — run the installer first",
              }[String(r.status)]) || ("unexpected status " + r.status + " from /auth/login");
            }
            this.banner(detail, r.status === 429 ? "warn" : "err");
          } catch (e) {
            this.banner("network error — could not reach the panel. " +
                        "Check the URL/port/browser TLS exception.", "err");
          } finally {
            this.busy = false;
          }
        }
      };
    }
  </script>
</body>
</html>
